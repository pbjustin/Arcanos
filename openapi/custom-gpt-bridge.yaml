openapi: 3.1.0
info:
  title: Arcanos Custom GPT Bridge
  version: 1.2.0
  description: |
    Secure HTTP bridge for Custom GPT Actions. The bridge authenticates inbound
    Custom GPT requests, enqueues them through the existing Arcanos job
    infrastructure, and returns either a completed result or canonical job
    polling URLs. Job-backed responses also return a job-specific
    jobReadToken and the fixed x-arcanos-job-read-token header name. Retain
    that capability with the job id and send it only in the documented header
    on status, result, or stream reads.

    The health_echo and echo actions are deterministic transport smoke checks:
    they verify auth, bridge handling, queueing, worker execution, and
    /jobs/{jobId}/result retrieval without invoking the ARCANOS Trinity model
    pipeline. The query and query_and_wait actions execute real model behavior.
servers:
  - url: https://YOUR-RAILWAY-DOMAIN
    description: Replace with the deployed Railway service domain.
paths:
  /api/bridge/gpt:
    post:
      operationId: invokeArcanosGptBridge
      summary: Invoke an Arcanos GPT ID through the secure bridge
      description: |
        Submit a bridge action to the Arcanos backend. Use health_echo or echo
        for deterministic transport verification. Use query_and_wait when the
        Custom GPT should wait briefly for completed model output before
        falling back to async polling. All bridge responses are private and
        no-store. A job-backed response includes the capability required by
        the generic jobs API.
      security:
        - bearerAuth: []
        - openaiActionSecretHeader: []
        - actionSecretHeader: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeRequest"
            examples:
              healthEcho:
                summary: Deterministic transport smoke test
                value:
                  gptId: arcanos-core
                  action: health_echo
              echo:
                summary: Deterministic transport smoke test alias
                value:
                  gptId: arcanos-core
                  action: echo
              queryAndWait:
                summary: Query and wait briefly
                value:
                  gptId: arcanos-core
                  prompt: Summarize current deployment health.
                  action: query_and_wait
                  metadata:
                    source: custom-gpt-action
      responses:
        "200":
          description: Bridge execution completed within the bounded wait window.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SmokeCompletedResponse"
                  - $ref: "#/components/schemas/BridgeCompletedResponse"
              examples:
                smokeCompleted:
                  value:
                    ok: true
                    status: completed
                    output: OK
        "202":
          description: Bridge execution is pending; poll the jobs API.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgePendingResponse"
        "400":
          description: Invalid bridge request payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "401":
          description: Missing or invalid bridge shared secret.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "409":
          description: Idempotency key conflict.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "404":
          description: An accepted queued job was no longer present during the bounded wait. The response retains the job id and read capability for a direct follow-up lookup.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "410":
          description: An accepted queued job expired during the bounded wait. The response retains the job id and read capability for the terminal lookup.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "500":
          description: Routing, worker, or provider failure.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "503":
          description: Bridge, job-read capability signing, or queue storage is unavailable or misconfigured, including after a job was accepted but its status could not be read.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
              examples:
                repositoryUnavailableAfterAcceptance:
                  summary: Durable job status became unavailable after acceptance
                  value:
                    ok: false
                    status: queue_error
                    error:
                      source: queue
                      message: Durable GPT job persistence is unavailable.
                    request_id: req_example
                    jobId: job_example
                    jobReadToken: v1.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    jobReadTokenHeader: x-arcanos-job-read-token
                    timing: {}
  /api/bridge/health:
    get:
      operationId: getArcanosBridgeHealth
      summary: Check bridge runtime health
      description: Reports environment sanity, including job-read signing readiness, route reachability, database status, worker status, and recent bridge failure counters to callers authenticated with the bridge shared secret.
      security:
        - bearerAuth: []
        - openaiActionSecretHeader: []
        - actionSecretHeader: []
      responses:
        "200":
          description: Bridge health is OK.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeHealthResponse"
        "401":
          description: Missing or invalid bridge shared secret.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeErrorResponse"
        "503":
          description: Bridge health is degraded or a required bridge, job-read signing, routing, database, or worker dependency is not configured or ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BridgeHealthResponse"
                  - $ref: "#/components/schemas/BridgeErrorResponse"
  /jobs/{jobId}:
    get:
      operationId: getBridgeJobStatus
      summary: Poll canonical job status
      description: |
        Reads only public gpt and ask jobs; GPT jobs require recognized public
        route or custom-bridge provenance, and GPT Access-created jobs remain
        protected. Send the job-specific capability
        returned by the bridge response. Missing, malformed, duplicated,
        incorrect, and cross-job capabilities are concealed as not found.
        Every response is no-store.
      parameters:
        - $ref: "#/components/parameters/jobId"
        - $ref: "#/components/parameters/jobReadToken"
      responses:
        "200":
          description: Job status payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: Invalid job id.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          description: Job or valid job-read capability not found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "503":
          description: Job-read capability signing or durable job persistence is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /jobs/{jobId}/result:
    get:
      operationId: getBridgeJobResult
      summary: Read canonical job result
      description: |
        Reads only public gpt and ask jobs with recognized public provenance.
        Missing jobs, protected GPT Access jobs, non-public job types,
        and missing, malformed, duplicated, incorrect, or cross-job
        capabilities return the compatible in-body status not_found. Every
        response is no-store.
      parameters:
        - $ref: "#/components/parameters/jobId"
        - $ref: "#/components/parameters/jobReadToken"
      responses:
        "200":
          description: Job result payload.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          description: Invalid job id.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "503":
          description: Job-read capability signing or durable job persistence is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
  /jobs/{jobId}/stream:
    get:
      operationId: streamBridgeJobStatus
      summary: Stream canonical job status
      description: |
        Streams lifecycle changes for a public gpt or ask job with recognized
        public provenance. Send the
        job-specific capability returned by the bridge response. Missing,
        malformed, duplicated, incorrect, and cross-job capabilities are
        concealed as not found. The SSE response is no-store, no-cache, and
        no-transform.
      parameters:
        - $ref: "#/components/parameters/jobId"
        - $ref: "#/components/parameters/jobReadToken"
      responses:
        "200":
          description: Server-sent status and terminal events.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid job id.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          description: Job or valid job-read capability not found.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "503":
          description: Job-read capability signing or durable job persistence is unavailable before the stream opens.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
components:
  headers:
    NoStore:
      description: Response is marked Cache-Control with a no-store directive.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Preferred. Use OPENAI_ACTION_SHARED_SECRET as the bearer token.
    openaiActionSecretHeader:
      type: apiKey
      in: header
      name: x-openai-action-secret
      description: Alternative shared-secret header using OPENAI_ACTION_SHARED_SECRET.
    actionSecretHeader:
      type: apiKey
      in: header
      name: x-action-secret
      description: Legacy alternative shared-secret header using OPENAI_ACTION_SHARED_SECRET.
  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable retry key for the same semantic bridge request.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    jobReadToken:
      name: x-arcanos-job-read-token
      in: header
      required: true
      description: |
        Job-specific bearer capability returned as jobReadToken by the bridge
        response. Send exactly one value bound to this path job id. Query
        parameters, cookies, and request bodies are not accepted carriers.
      schema:
        type: string
        pattern: '^v1\.[A-Za-z0-9_-]{43}$'
  schemas:
    BridgeRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        gptId:
          type: string
          minLength: 1
          maxLength: 128
          description: GPT ID to invoke. Defaults to DEFAULT_GPT_ID when omitted.
          example: arcanos-core
        prompt:
          type: string
          minLength: 1
          maxLength: 50000
          description: Required for query and query_and_wait; ignored by health_echo and echo.
        action:
          type: string
          enum:
            - health_echo
            - echo
            - query
            - query_and_wait
        metadata:
          type: object
          additionalProperties: true
          description: Optional JSON metadata and wait controls.
    SmokeCompletedResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - status
        - output
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: completed
        output:
          type: string
          const: OK
    BridgeCompletedResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - status
        - jobId
        - jobReadToken
        - jobReadTokenHeader
        - output
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: completed
        jobId:
          type: string
        poll_url:
          type: string
        result_url:
          type: string
        jobReadToken:
          $ref: "#/components/schemas/JobReadToken"
        jobReadTokenHeader:
          $ref: "#/components/schemas/JobReadTokenHeader"
        output:
          description: Normalized internal GPT output.
        request_id:
          type: string
    BridgePendingResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - status
        - jobId
        - poll_url
        - result_url
        - jobReadToken
        - jobReadTokenHeader
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          const: pending
        action:
          type: string
          enum:
            - health_echo
            - echo
            - query
            - query_and_wait
        jobId:
          type: string
        poll_url:
          type: string
        result_url:
          type: string
        jobReadToken:
          $ref: "#/components/schemas/JobReadToken"
        jobReadTokenHeader:
          $ref: "#/components/schemas/JobReadTokenHeader"
        poll:
          type: string
        result:
          type: object
          required:
            - method
            - url
          properties:
            method:
              type: string
              const: GET
            url:
              type: string
        job_status:
          type: string
        lifecycle_status:
          type: string
        request_id:
          type: string
        timing:
          type: object
          additionalProperties: true
        observability:
          type: object
          additionalProperties: true
    BridgeErrorResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - status
        - error
      properties:
        ok:
          type: boolean
          const: false
        status:
          type: string
        request_id:
          type:
            - string
            - "null"
        jobId:
          type: string
        jobReadToken:
          $ref: "#/components/schemas/JobReadToken"
        jobReadTokenHeader:
          $ref: "#/components/schemas/JobReadTokenHeader"
        error:
          type: object
          required:
            - source
            - message
          properties:
            source:
              type: string
              enum:
                - routing
                - queue
                - worker
                - provider
                - timeout
                - auth
            message:
              type: string
    BridgeHealthResponse:
      type: object
      additionalProperties: true
      required:
        - ok
        - status
        - env
        - missing_required_env
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum:
            - ok
            - degraded
        request_id:
          type: string
        env:
          type: object
          required:
            - OPENAI_ACTION_SHARED_SECRET
            - ARCANOS_JOB_READ_CAPABILITY_SECRET
            - ARCANOS_JOB_READ_CAPABILITY_PREVIOUS_SECRET
            - DEFAULT_GPT_ID
          additionalProperties: true
          properties:
            OPENAI_ACTION_SHARED_SECRET:
              type: object
              required:
                - configured
              properties:
                configured:
                  type: boolean
            ARCANOS_JOB_READ_CAPABILITY_SECRET:
              type: object
              required:
                - configured
              properties:
                configured:
                  type: boolean
            ARCANOS_JOB_READ_CAPABILITY_PREVIOUS_SECRET:
              type: object
              description: Optional verification-only prior key used during a bounded rotation overlap.
              required:
                - configured
              properties:
                configured:
                  type: boolean
            DEFAULT_GPT_ID:
              type: object
              required:
                - configured
                - valid
              properties:
                configured:
                  type: boolean
                valid:
                  type: boolean
                value:
                  type:
                    - string
                    - "null"
                error:
                  type:
                    - string
                    - "null"
        missing_required_env:
          type: array
          items:
            type: string
        route_reachability:
          type: object
          additionalProperties: true
        database:
          type: object
          additionalProperties: true
        worker_status:
          type: object
          additionalProperties: true
        recent_failure_counters:
          type: object
          additionalProperties: true
        failure_counters_since_start:
          type: object
          additionalProperties:
            type: number
    JobReadToken:
      type: string
      pattern: '^v1\.[A-Za-z0-9_-]{43}$'
      description: |
        Job-specific bearer capability. Treat it as sensitive and send it only
        in x-arcanos-job-read-token for the matching job id.
    JobReadTokenHeader:
      type: string
      const: x-arcanos-job-read-token

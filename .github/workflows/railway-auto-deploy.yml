name: Railway Auto Deploy

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dag_writer_rollout_confirmation:
        description: >-
          While the coordinated DAG writer hold is active, type exactly:
          DAG WRITERS DRAINED: 20260727-dag-snapshot-generation-v1
        required: false
        type: string

env:
  # Keep one explicit repository-owned state. "none" restores normal automatic
  # promotion only after the coordinated rollout is verified in every writer.
  # Missing, blank, or malformed values fail closed in the policy job.
  ARCANOS_COORDINATED_DAG_WRITER_ROLLOUT_HOLD: '20260727-dag-snapshot-generation-v1'

permissions:
  contents: read

jobs:
  rollout-policy:
    name: Coordinated DAG writer rollout policy
    if: >-
      (github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.rollout_guard.outputs.should_deploy }}
      hold_active: ${{ steps.rollout_guard.outputs.hold_active }}
      hold_id: ${{ steps.rollout_guard.outputs.hold_id }}
      reason: ${{ steps.rollout_guard.outputs.reason }}

    steps:
      - name: Checkout rollout policy
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'

      - name: Enforce coordinated DAG writer rollout policy
        id: rollout_guard
        env:
          ARCANOS_DEPLOY_EVENT_NAME: ${{ github.event_name }}
          ARCANOS_COORDINATED_DAG_WRITER_ROLLOUT_HOLD: ${{ env.ARCANOS_COORDINATED_DAG_WRITER_ROLLOUT_HOLD }}
          ARCANOS_DAG_WRITER_ROLLOUT_CONFIRMATION: ${{ github.event.inputs.dag_writer_rollout_confirmation || '' }}
        run: node scripts/railway-coordinated-rollout-guard.mjs

  deploy-production:
    name: Deploy Production (Railway)
    needs: rollout-policy
    if: >-
      needs.rollout-policy.outputs.should_deploy == 'true'
      && ((github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    concurrency:
      group: railway-auto-deploy-production
      cancel-in-progress: true
    env:
      DEPLOY_REF: ${{ github.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Verify deploy ref is current default tip
        shell: bash
        run: |
          set -euo pipefail

          live_default_record="$(
            git ls-remote --exit-code --refs origin "refs/heads/${DEFAULT_BRANCH}"
          )"
          if [[ "${live_default_record}" == *$'\n'* ]]; then
            echo "RAILWAY_DEPLOY_DEFAULT_REF_AMBIGUOUS"
            exit 1
          fi

          IFS=$'\t' read -r live_default_sha live_default_ref live_default_extra <<< "${live_default_record}"
          if (
            [[ ! "${live_default_sha}" =~ ^[0-9a-f]{40}$ ]] ||
            [ "${live_default_ref}" != "refs/heads/${DEFAULT_BRANCH}" ] ||
            [ -n "${live_default_extra:-}" ]
          ); then
            echo "RAILWAY_DEPLOY_DEFAULT_REF_INVALID"
            exit 1
          fi
          if [ "${live_default_sha}" != "${DEPLOY_REF}" ]; then
            echo "RAILWAY_DEPLOY_REF_NOT_CURRENT_DEFAULT_TIP"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.19.0'

      - name: Install verified Railway CLI
        shell: bash
        env:
          RAILWAY_CLI_VERSION: '4.30.2'
          RAILWAY_CLI_ARCHIVE_SHA256: e8bd57fd6517b5cf387a9c072ce79fdc069fc0b877c171b58e325b22e96c9000
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          bin_dir="${RUNNER_TEMP}/railway-cli-${RAILWAY_CLI_VERSION}"
          download_url="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"

          curl --fail --silent --show-error --location \
            --proto '=https' \
            --tlsv1.2 \
            "${download_url}" \
            --output "${archive}"

          printf '%s  %s\n' "${RAILWAY_CLI_ARCHIVE_SHA256}" "${archive}" |
            sha256sum --check --strict

          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}"
          chmod 0755 "${bin_dir}/railway"

          actual_version="$("${bin_dir}/railway" --version)"
          expected_version="railway ${RAILWAY_CLI_VERSION}"
          test "${actual_version}" = "${expected_version}"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Validate deploy configuration
        id: deploy_config
        env:
          RAILWAY_PROJECT_TOKEN_CONFIGURED: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing_fields=()

          # //audit Assumption: repo-connected Railway deploys may already handle production promotion; failure risk: this workflow fails red on every main push when optional GitHub-side Railway credentials are intentionally unset; expected invariant: workflow_run auto-deploy only executes when all Railway credentials are configured; handling strategy: record missing configuration and skip auto mode cleanly while preserving manual-dispatch failures.
          if [ "${RAILWAY_PROJECT_TOKEN_CONFIGURED}" != "true" ]; then
            missing_fields+=("RAILWAY_PRODUCTION_PROJECT_TOKEN")
          fi

          # //audit Assumption: project and service identifiers are required only for GitHub-driven Railway CLI deploys; failure risk: redundant automation path blocks branch protection even though Railway repo deploy already shipped; expected invariant: missing identifiers are surfaced explicitly; handling strategy: aggregate missing identifiers into one decision output.
          if [ -z "${RAILWAY_PROJECT_ID:-}" ]; then
            missing_fields+=("RAILWAY_PROJECT_ID")
          fi

          if [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            missing_fields+=("RAILWAY_SERVICE_ID")
          fi

          if [ -z "${RAILWAY_ENVIRONMENT_NAME:-}" ]; then
            echo "RAILWAY_ENVIRONMENT_NAME not set; defaulting to production"
            echo "RAILWAY_ENVIRONMENT_NAME=production" >> "$GITHUB_ENV"
          fi

          if [ "${#missing_fields[@]}" -eq 0 ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "missing_fields=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing_fields_csv="$(IFS=,; printf '%s' "${missing_fields[*]}")"
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "missing_fields=${missing_fields_csv}" >> "$GITHUB_OUTPUT"
          echo "GitHub-side Railway deploy is not configured. Missing: ${missing_fields_csv}"

      - name: Fail manual deploy when Railway credentials are missing
        if: github.event_name == 'workflow_dispatch' && steps.deploy_config.outputs.should_deploy != 'true'
        run: |
          set -euo pipefail
          echo "Manual Railway deploy requested but configuration is incomplete: ${{ steps.deploy_config.outputs.missing_fields }}"
          exit 1

      - name: Skip auto deploy when Railway credentials are missing
        if: github.event_name == 'workflow_run' && steps.deploy_config.outputs.should_deploy != 'true'
        run: |
          set -euo pipefail
          echo "Skipping GitHub-driven Railway deploy; Railway repo deploy remains the active path."
          echo "Missing configuration: ${{ steps.deploy_config.outputs.missing_fields }}"

      - name: Verify Railway deploy access
        if: steps.deploy_config.outputs.should_deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          # //audit Assumption: GitHub Actions may use a project-scoped Railway token instead of a user-scoped account token; failure risk: `railway whoami` rejects valid deploy credentials and blocks automated deploys; expected invariant: the configured token can read project-scoped service state before deploy; handling strategy: probe service variables with the target service/environment pair.
          railway variable list \
            --environment "${RAILWAY_ENVIRONMENT_NAME}" \
            --service "${RAILWAY_SERVICE_ID}" \
            --json > /dev/null

      - name: Deploy to Railway
        if: steps.deploy_config.outputs.should_deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          deploy_result_json="$(railway up \
            --ci \
            --detach \
            --json \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_NAME}" \
            --service "${RAILWAY_SERVICE_ID}" \
            --message "GitHub auto deploy ${DEPLOY_REF}")"
          deployment_id="$(node -e "
            const payload = JSON.parse(process.argv[1]);
            const deploymentId = payload.deploymentId;
            if (
              typeof deploymentId !== 'string'
              || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(deploymentId)
            ) {
              throw new Error('RAILWAY_DEPLOYMENT_ID_INVALID');
            }
            process.stdout.write(deploymentId);
          " "${deploy_result_json}")"

          echo "DEPLOYMENT_ID=${deployment_id}" >> "$GITHUB_ENV"
          echo "Queued exact Railway deployment ${deployment_id} for ${DEPLOY_REF}."

      - name: Wait for deployment success
        if: steps.deploy_config.outputs.should_deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          final_status=""
          exact_deployment_succeeded="false"
          for attempt in $(seq 1 30); do
            final_status="$(railway deployment list \
              --service "${RAILWAY_SERVICE_ID}" \
              --environment "${RAILWAY_ENVIRONMENT_NAME}" \
              --limit 100 \
              --json \
              | node -e "
              const { readFileSync } = require('node:fs');
              const deployments = JSON.parse(readFileSync(0, 'utf8'));
              const expectedDeploymentId = process.env.DEPLOYMENT_ID;
              if (
                typeof expectedDeploymentId !== 'string'
                || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(expectedDeploymentId)
              ) {
                throw new Error('RAILWAY_DEPLOYMENT_ID_INVALID');
              }
              if (!Array.isArray(deployments)) {
                throw new Error('RAILWAY_DEPLOYMENT_LIST_INVALID');
              }
              const deployment = deployments.find(
                candidate => candidate?.id === expectedDeploymentId,
              );
              if (deployment === undefined) {
                process.stdout.write('NOT_FOUND');
                process.exit(0);
              }
              const status = deployment.status;
              if (typeof status !== 'string' || !/^[A-Z][A-Z_]{0,31}$/u.test(status)) {
                throw new Error('RAILWAY_DEPLOYMENT_STATUS_INVALID');
              }
              process.stdout.write(status);
            ")"

            echo "attempt=${attempt} deployment_id=${DEPLOYMENT_ID} status=${final_status}"

            if [ "${final_status}" = "NOT_FOUND" ]; then
              sleep 10
              continue
            fi

            if [ "${final_status}" = "SUCCESS" ]; then
              exact_deployment_succeeded="true"
              break
            fi

            if [ "${final_status}" = "FAILED" ] || [ "${final_status}" = "REMOVED" ] || [ "${final_status}" = "CRASHED" ] || [ "${final_status}" = "STOPPED" ]; then
              echo "Deployment reached terminal failure state: ${final_status}"
              exit 1
            fi

            sleep 10
          done

          if [ "${exact_deployment_succeeded}" != "true" ]; then
            echo "Exact deployment did not reach SUCCESS within polling window."
            exit 1
          fi

          # Railway reports SUCCESS only after the configured deployment
          # healthcheck returns 200. Static validation binds that platform
          # observation to the repository-owned /readyz and 60-second drain
          # contract. Public roles receive an immediate bounded direct request;
          # a private worker retains the platform activation result rather than
          # acquiring a public domain solely for this check.
          node scripts/validate-railway-compatibility.js

          activation_status_before_json="$(railway service status \
            --service "${RAILWAY_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_NAME}" \
            --json)"
          node -e "
            const payload = JSON.parse(process.argv[1]);
            if (
              payload.deploymentId !== process.env.DEPLOYMENT_ID
              || payload.status !== 'SUCCESS'
            ) {
              throw new Error('RAILWAY_READINESS_ACTIVATION_EVIDENCE_MISMATCH');
            }
          " "${activation_status_before_json}"

          railway variable list \
            --service "${RAILWAY_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_NAME}" \
            --json \
            | node scripts/verify-railway-readiness-activation.mjs

          activation_status_after_json="$(railway service status \
            --service "${RAILWAY_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_NAME}" \
            --json)"
          node -e "
            const payload = JSON.parse(process.argv[1]);
            if (
              payload.deploymentId !== process.env.DEPLOYMENT_ID
              || payload.status !== 'SUCCESS'
            ) {
              throw new Error('RAILWAY_READINESS_ACTIVATION_EVIDENCE_MISMATCH');
            }
          " "${activation_status_after_json}"

          echo "deployment_id=${DEPLOYMENT_ID} status=SUCCESS tracked_healthcheck=/readyz tracked_drainingSeconds=60 effective_settings_readback=required"

      - name: Post-deploy watchdog/budget regression check
        if: steps.deploy_config.outputs.should_deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-railway-timeout-regressions.js \
            --since 15m \
            --lines 500 \
            --fail-on-budget-abort \
            --service "${RAILWAY_SERVICE_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_NAME}"

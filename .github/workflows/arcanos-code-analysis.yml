name: ARCANOS Code Analysis (Advisory Validation)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to analyze'
        required: false
        type: string
      trigger_source:
        description: 'Source that triggered this workflow'
        required: false
        default: 'manual'
        type: string

jobs:
  arcanos-analysis:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate analysis inputs
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha || github.sha }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full lowercase commit SHA'; exit 1; }
          [[ "$TRIGGER_SOURCE" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo 'Invalid trigger source'; exit 1; }
          # Only analyze commits already reachable from the trusted main branch.
          STATUS=$(gh api "repos/$GH_REPO/compare/$REQUESTED_SHA...main" --jq .status)
          [[ "$STATUS" == ahead || "$STATUS" == identical ]] || { echo 'Commit must be on main'; exit 1; }
          echo "commit_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ steps.target.outputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: Verify checkout SHA
        env:
          COMMIT_SHA: ${{ steps.target.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: Validate types
        run: npm run type-check

      - name: Validate lint
        run: npm run lint

      - name: Advisory summary
        env:
          COMMIT_SHA: ${{ steps.target.outputs.commit_sha }}
        run: |
          {
            echo '# ARCANOS Advisory Validation'
            printf "Validated commit: \`%s\`\n" "$COMMIT_SHA"
            echo 'Type-check and lint passed for this commit.'
            echo 'This manual validation does not establish merge approval or deployment readiness.'
            echo 'The former local-server AI path and automated issue publication are retired.'
          } > analysis_summary.md
          cat analysis_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcanos-analysis-${{ steps.target.outputs.commit_sha }}
          path: analysis_summary.md
          if-no-files-found: error
          retention-days: 30

# Validate policy drift without changing repository contents.
name: Enforce ARCANOS Audit Cycle

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate audit config
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -se --arg target "github.com/$REPOSITORY" '
            length == 1 and (.[0] |
              type == "object" and
              .module == "auto_audit_0432" and
              .cycle == "4WEEK" and
              .target == $target
            )
          ' arcanos_audit_config.json

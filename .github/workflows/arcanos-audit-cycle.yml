# Validate policy drift without changing repository contents.
name: Enforce ARCANOS Audit Cycle

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Validate audit config
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -e --arg target "github.com/$REPOSITORY" '
            type == "object" and
            .module == "auto_audit_0432" and
            .cycle == "4WEEK" and
            .target == $target
          ' arcanos_audit_config.json

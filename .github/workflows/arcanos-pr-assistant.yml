name: ARCANOS PR Assistant (Advisory Snapshot)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: string

jobs:
  arcanos-pr-analysis:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate PR and capture diff
        id: pr-details
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo 'Invalid PR number'; exit 1; }
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > pr-metadata.json
          test "$(jq -r .state pr-metadata.json)" = open
          HEAD_SHA=$(jq -r .head.sha pr-metadata.json)
          BASE_SHA=$(jq -r .base.sha pr-metadata.json)
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" -H 'Accept: application/vnd.github.diff' > pr.diff
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > changed_files.txt
          # Reject a moving target rather than attributing a mixed snapshot to a commit.
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > pr-current.json
          test "$(jq -r .head.sha pr-current.json)" = "$HEAD_SHA"
          test "$(jq -r .base.sha pr-current.json)" = "$BASE_SHA"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Advisory snapshot summary
        env:
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr-details.outputs.base_sha }}
        run: |
          {
            echo '# ARCANOS Advisory PR Snapshot'
            printf 'PR #%s head: `%s`; base: `%s`\n\n' "$PR_NUMBER" "$PR_HEAD_SHA" "$PR_BASE_SHA"
            echo 'The artifact contains the captured PR diff and changed-file list.'
            echo 'PR code was not executed. This snapshot is not merge approval or deployment readiness.'
            echo 'The former backend AI analysis and automated readiness checks are retired.'
          } > analysis_report.md
          cat analysis_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcanos-pr-analysis-${{ steps.pr-details.outputs.pr_number }}-${{ steps.pr-details.outputs.head_sha }}
          path: |
            analysis_report.md
            pr-metadata.json
            pr.diff
            changed_files.txt
          if-no-files-found: error
          retention-days: 30

name: PR 1522 Supplemental Railway Preview Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-preview-proof:
    if: github.ref == 'refs/heads/test/pr1522-preview-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: '1522'
      TESTED_SHA: '3e02920b3d61ec7da298b9c188b6a54783122aff'
      WEB_BASE_URL: 'https://arcanos-v2-pr-676861-1522.up.railway.app'
      WORKER_BASE_URL: 'https://arcanos-worker-pr-676861-1522.up.railway.app'
    steps:
      - name: Check out reviewed exact PR head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.1'

      - name: Validate explicit targets without network
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 node scripts/native-pr-preview-e2e.mjs \
            --pr-number "$PR_NUMBER" --commit-sha "$TESTED_SHA" \
            --web-base-url "$WEB_BASE_URL" --worker-base-url "$WORKER_BASE_URL" \
            > "$RUNNER_TEMP/pr1522-preview-dry.json"
          cat "$RUNNER_TEMP/pr1522-preview-dry.json"

      - name: Execute reviewed credential-free PR-head verifier
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 node scripts/native-pr-preview-e2e.mjs \
            --pr-number "$PR_NUMBER" --commit-sha "$TESTED_SHA" \
            --web-base-url "$WEB_BASE_URL" --worker-base-url "$WORKER_BASE_URL" \
            --execute --allow-network \
            > "$RUNNER_TEMP/pr1522-preview-executed.json"
          cat "$RUNNER_TEMP/pr1522-preview-executed.json"

      - name: Confirm executed Gaming generation budget proof
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr1522-preview-executed.json').read_text())
          assert result['executed'] is True and result['networkAttempted'] is True
          assert result['target']['commitSha'] == os.environ['TESTED_SHA']
          assert result['summary']['status'] == 'PASS'
          assert result['summary']['checksPassed'] == result['summary']['requestsMade'] == 171
          checks = [c for c in result['checks'] if c.get('gamingGenerationBudgetVerified')]
          assert len(checks) == 1 and checks[0]['caseId'] == 'gaming-query-guide'
          assert checks[0]['gamingGenerationBudgetProofVersion'] == 'gaming-generation-budget/v1'
          evidence = {'target': result['target'], 'summary': result['summary'], 'generationBudget': checks[0]}
          print(json.dumps(evidence, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified sealed synthetic preview at exact PR head.\n\n```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          PY

      - name: Retain credential-free verifier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1522-exact-head-preview-proof
          path: ${{ runner.temp }}/pr1522-preview-*.json
          retention-days: 30

# Authoritative required workflow for branch protection checks.
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.1'
  OPENAI_API_KEY: 'mock-api-key'
  FORCE_MOCK: 'true'
  OPENAI_BASE_URL: 'http://127.0.0.1:9/v1'
  # Synthetic authority for mocked CI imports and normal-server startup only.
  AI_MODEL: 'ft:gpt-4.1-2025-04-14:arcanos-test:authority:offline'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🛡️ Commit guardrails
        run: npm run guard:commit

      - name: Verify bounded self-heal acceptance controller contracts
        run: node --test scripts/self-heal-preview-acceptance.test.mjs

      - name: 🧾 Validate backend/CLI contract manifest
        run: npm run validate:backend-cli:contract

      - name: 🧱 Enforce CEF boundaries
        run: |
          npm run check:boundaries
          npm run check:cef-layer-access

      - name: 🔧 Type check
        run: npm run type-check

      - name: 🧹 Lint code
        run: npm run lint

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]

    strategy:
      matrix:
        node-version: ['24.18.1']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Compiled app model-policy E2E
        run: npm run test:model-policy:app:e2e

      - name: 🧪 Compiled app heartbeat E2E
        run: npm run test:heartbeat:app:e2e

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    
    strategy:
      matrix:
        test-type: [unit, integration]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🐍 Setup Python for transport-matrix tests
        if: matrix.test-type == 'unit'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install minimal Python protocol runtime dependencies
        if: matrix.test-type == 'unit'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "jsonschema>=4.23.0,<5" "referencing>=0.35.1,<1"

      - name: 🔨 Build project
        run: npm run build

      - name: 🧪 Run unit tests
        if: matrix.test-type == 'unit'
        run: npm test -- --json --outputFile="$RUNNER_TEMP/jest-result.json"

      - name: Offline live validation security contracts
        run: npm run test:live-pr-preview:offline && npm run test:live-validation:offline

      - name: 📊 Upload Node coverage to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          flags: node
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🔌 Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          # Set minimal environment for testing
          export OPENAI_API_KEY=mock-api-key
          export NODE_ENV=test
          export PORT=0
          npm run test:integration -- --json --outputFile="$RUNNER_TEMP/jest-result.json"

      - name: Retain Jest counters and checkout provenance
        if: always()
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_TEST_TYPE: ${{ matrix.test-type }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const revision = ref => execFileSync('git', ['rev-parse', '--verify', ref],
            { encoding: 'utf8', timeout: 5000, stdio: ['ignore', 'pipe', 'ignore'] }).trim();
          const testedSha = revision('HEAD');
          const testedTree = revision('HEAD^{tree}');
          const headSha = process.env.EVIDENCE_HEAD_SHA;
          let headTree = null;
          if (/^[0-9a-f]{40}$/.test(headSha ?? '')) {
            try { headTree = revision(`${headSha}^{tree}`); } catch { /* Shallow checkout may omit the head object. */ }
          }
          const resultPath = path.join(process.env.RUNNER_TEMP, 'jest-result.json');
          const counts = { headSha, testedSha, testedTree, headTree,
            exactHeadTree: headTree !== null && testedTree === headTree,
            selection: process.env.EVIDENCE_TEST_TYPE, resultAvailable: existsSync(resultPath) };
          if (counts.resultAvailable) {
            const result = JSON.parse(readFileSync(resultPath, 'utf8'));
            for (const key of ['success', 'numTotalTests', 'numPassedTests', 'numFailedTests',
              'numPendingTests', 'numTodoTests', 'numTotalTestSuites', 'numPassedTestSuites',
              'numFailedTestSuites', 'numPendingTestSuites', 'startTime']) counts[key] = result[key];
          }
          const serialized = JSON.stringify(counts, null, 2) + '\n';
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'jest-counts.json'), serialized);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + serialized + '```\n');
          console.log(serialized);
          NODE

      - name: Upload Jest counters and checkout provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-counts-${{ matrix.test-type }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jest-counts.json
          retention-days: 30

  validate-railway-compatibility:
    name: Railway Compatibility
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🚄 Validate Railway compatibility
        run: npm run validate:railway

      - name: 🐳 Test Docker build
        run: |
          docker build -t arcanos-test .
          echo "✅ Docker build successful"

      - name: Verify isolated self-heal preview image artifact and executable ownership
        timeout-minutes: 10
        run: |
          set -euo pipefail
          certificate_dir="$(mktemp -d "$RUNNER_TEMP/self-heal-preview-ca.XXXXXX")"
          trap 'rm -f "$certificate_dir/fixture.key" "$certificate_dir/fixture.pem"; rmdir "$certificate_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout "$certificate_dir/fixture.key" -out "$certificate_dir/fixture.pem" \
            -subj '/CN=postgres.railway.internal' \
            -addext 'subjectAltName=DNS:postgres.railway.internal' >/dev/null 2>&1
          rm -f "$certificate_dir/fixture.key"
          certificate_pem="$(cat "$certificate_dir/fixture.pem")"
          docker build -t arcanos-self-heal-preview-test \
            --build-arg ARCANOS_SELF_HEAL_PREVIEW_PROFILE=worker-coordinator-v1 \
            --build-arg ARCANOS_BACKSTAGE_HEAVY_PROOF_SOURCE_SHA="$GITHUB_SHA" \
            --build-arg ARCANOS_SELF_HEAL_PREVIEW_DATABASE_CERTIFICATE_PEM="$certificate_pem" .
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node arcanos-self-heal-preview-test \
            scripts/self-heal-preview-artifact.mjs --verify --source-sha "$GITHUB_SHA"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node arcanos-self-heal-preview-test scripts/repair-dist-aliases.js --check
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node arcanos-self-heal-preview-test --input-type=module -e '
              import { resolveSelfHealPreviewProfile, buildSelfHealPreviewApplicationEnvironment,
                verifySelfHealPreviewDatabaseCertificateFile, SELF_HEAL_PREVIEW_DATABASE_CERTIFICATE_PATH } from "./scripts/railway-self-heal-preview-profile.mjs";
              const fs = await import("node:fs");
              const { Client } = await import("pg");
              const fixture = JSON.parse(process.argv[1]);
              fixture.ARCANOS_SELF_HEAL_PREVIEW_DATABASE_CERTIFICATE_PEM = fs.readFileSync(SELF_HEAL_PREVIEW_DATABASE_CERTIFICATE_PATH, "utf8");
              const now = Date.now();
              fixture.ARCANOS_BACKSTAGE_HEAVY_PROOF_SOURCE_SHA = process.argv[2];
              fixture.RAILWAY_GIT_COMMIT_SHA = process.argv[2];
              fixture.ARCANOS_SELF_HEAL_PREVIEW_ISSUED_AT = new Date(now - 1000).toISOString();
              fixture.ARCANOS_SELF_HEAL_PREVIEW_EXPIRES_AT = new Date(now + 60000).toISOString();
              const imageMetadata = { ARCANOS_WORKSPACE_ROOT: "/app", ARCANOS_PYTHON_RUNTIME_DIR: "/app/daemon-python", RAILWAY_CLI_BIN: "/usr/local/bin/railway-native" };
              for (const [name, value] of Object.entries(imageMetadata)) {
                if (process.env[name] !== value) throw new Error("SELF_HEAL_PREVIEW_IMAGE_METADATA_MISSING");
              }
              for (const role of ["worker", "web"]) {
                const env = { ...process.env, ...fixture };
                if (role === "web") {
                  env.ARCANOS_PROCESS_KIND = "web";
                  env.RAILWAY_SERVICE_ID = fixture.ARCANOS_SELF_HEAL_PREVIEW_WEB_SERVICE_ID;
                  env.RAILWAY_SERVICE_NAME = "arcanos-web-pr1544-heavy";
                  env.OPENAI_BASE_URL = "http://127.0.0.1:9/v1";
                  delete env.ARCANOS_PREVIEW_OPENAI_FIXTURE;
                  env.ARCANOS_BACKSTAGE_BOOKER_ASYNC_GENERATION_ENABLED = "true";
                  env.ARCANOS_BACKSTAGE_BOOKER_ACCESS_TOKEN = "fictional-image-preview-access-token-0001";
                  env.ARCANOS_JOB_READ_CAPABILITY_SECRET = "fictional-image-preview-job-read-secret-0001";
                }
                const profile = resolveSelfHealPreviewProfile(role, env, { now: () => now });
                verifySelfHealPreviewDatabaseCertificateFile(profile, { now: () => now });
                const child = buildSelfHealPreviewApplicationEnvironment(profile, env);
                // Constructor parsing does no network or SQL. It proves the
                // production pool URL overrides its legacy false SSL object.
                const client = new Client({ connectionString: child.DATABASE_URL, ssl: { rejectUnauthorized: false } });
                if (client.connectionParameters.ssl.rejectUnauthorized === false || client.connectionParameters.ssl.ca !== profile.databaseCertificatePem) {
                  throw new Error("SELF_HEAL_PREVIEW_IMAGE_TLS_DOWNGRADE");
                }
                if (child.SELF_IMPROVE_EVIDENCE_DIR !== "/app/memory/self-heal-preview-evidence") {
                  throw new Error("SELF_HEAL_PREVIEW_EVIDENCE_DIRECTORY_INVALID");
                }
                fs.mkdirSync(child.SELF_IMPROVE_EVIDENCE_DIR, { recursive: true });
                const evidenceProbe = `${child.SELF_IMPROVE_EVIDENCE_DIR}/image-${role}-probe.json`;
                fs.writeFileSync(evidenceProbe, "{}");
                fs.unlinkSync(evidenceProbe);
                for (const name of Object.keys(imageMetadata)) {
                  if (Object.hasOwn(child, name)) throw new Error("SELF_HEAL_PREVIEW_IMAGE_METADATA_INHERITED");
                }
              }
              console.log("SELF_HEAL_PREVIEW_IMAGE_PROFILE_RESOLUTION_VERIFIED");
            ' \
            '{"ARCANOS_BACKSTAGE_HEAVY_PROOF_TARGET":"dedicated-backstage-heavy-preview-v1","ARCANOS_BACKSTAGE_HEAVY_PROOF_RUN_ID":"image-proof-run-1544","ARCANOS_PROCESS_KIND":"worker","NODE_ENV":"production","ARCANOS_PREVIEW_ISOLATION":"true","FORCE_MOCK":"true","ALLOW_MOCK_OPENAI":"true","OPENAI_API_KEY_REQUIRED":"false","OPENAI_BASE_URL":"http://127.0.0.1:8766/v1","ARCANOS_PREVIEW_OPENAI_FIXTURE":"backstage-heavy-compact-retry-v1","ARCANOS_BACKSTAGE_BOOKER_JOB_PAYLOAD_KEY":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=","DATABASE_URL":"postgresql://synthetic:synthetic@postgres.railway.internal:5432/railway","REDIS_URL":"redis://default:synthetic@redis.railway.internal:6379","RAILWAY_PROJECT_ID":"11111111-1111-4111-8111-111111111111","RAILWAY_PROJECT_NAME":"arc-pr1544-heavy-image","RAILWAY_ENVIRONMENT_ID":"22222222-2222-4222-8222-222222222222","RAILWAY_ENVIRONMENT_NAME":"backstage-heavy-pr-1544-e2e","RAILWAY_SERVICE_ID":"44444444-4444-4444-8444-444444444444","RAILWAY_SERVICE_NAME":"arcanos-worker-pr1544-heavy","RAILWAY_DEPLOYMENT_ID":"55555555-5555-4555-8555-555555555555","ARCANOS_BACKSTAGE_HEAVY_POSTGRES_SERVICE_ID":"66666666-6666-4666-8666-666666666666","ARCANOS_BACKSTAGE_HEAVY_POSTGRES_SERVICE_NAME":"Postgres","ARCANOS_BACKSTAGE_HEAVY_POSTGRES_INTERNAL_HOST":"postgres.railway.internal","ARCANOS_BACKSTAGE_HEAVY_REDIS_SERVICE_ID":"77777777-7777-4777-8777-777777777777","ARCANOS_BACKSTAGE_HEAVY_REDIS_SERVICE_NAME":"Redis","ARCANOS_BACKSTAGE_HEAVY_REDIS_INTERNAL_HOST":"redis.railway.internal","ARCANOS_SELF_HEAL_PREVIEW_PROFILE":"worker-coordinator-v1","ARCANOS_SELF_HEAL_PREVIEW_RUN_ID":"image-proof-run-1544","ARCANOS_SELF_HEAL_PREVIEW_CONTROL_TOKEN":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","ARCANOS_SELF_HEAL_PREVIEW_CONTROL_PORT":"8791","ARCANOS_SELF_HEAL_PREVIEW_STARTUP_MODE":"normal","ARCANOS_SELF_HEAL_PREVIEW_WEB_SERVICE_ID":"33333333-3333-4333-8333-333333333333","ARCANOS_SELF_HEAL_PREVIEW_WORKER_SERVICE_ID":"44444444-4444-4444-8444-444444444444"}' "$GITHUB_SHA"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node arcanos-self-heal-preview-test -e '
              const fs = require("node:fs");
              if (process.getuid() === 0) throw new Error("SELF_HEAL_PREVIEW_IMAGE_ROOT_USER");
              for (const path of ["/app", "/app/scripts", "/app/dist", "/app/config", "/app/config/self-heal-preview-database-ca.pem", "/app/scripts/self-heal-preview-artifact.json"]) {
                const stat = fs.statSync(path);
                if (stat.uid !== 0 || (stat.mode & 0o022) !== 0) throw new Error("SELF_HEAL_PREVIEW_IMAGE_WRITABLE_EXECUTABLE");
                let writable = true;
                try { fs.accessSync(path, fs.constants.W_OK); } catch { writable = false; }
                if (writable) throw new Error("SELF_HEAL_PREVIEW_IMAGE_EXECUTABLE_ACCESS");
              }
              console.log("SELF_HEAL_PREVIEW_IMAGE_OWNERSHIP_VERIFIED");
            '

  validate-deployment-readiness:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [build, test, validate-railway-compatibility]
    env:
      ARCANOS_GPT_ACCESS_BASE_URL: ${{ format('{0}://localhost:{1}', 'http', '8080') }}
      ARCANOS_GPT_ACCESS_SCOPES: >-
        runtime.read,workers.read,queue.read,jobs.create,jobs.result,
        logs.read_sanitized,db.explain_approved,mcp.approved_readonly,
        diagnostics.read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Verify preview E2E safety harness
        run: npm run test:preview-e2e

      - name: 🧪 Verify native PR preview containment contract
        run: npm run test:native-pr-preview-e2e

      - name: 🧪 Verify stacked draft preview authorization and isolation
        run: npm run test:stacked-draft-preview

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: 🔨 Restore workspace package builds
        run: npm run build:packages

      - name: 🚀 Test server startup
        run: |
          export NODE_ENV=production
          export PORT=8080
          export OPENAI_API_KEY=mock-api-key
          export ARCANOS_GPT_ACCESS_TOKEN=ci-gpt-access-token-for-local-workflow-only
          export ARCANOS_JOB_READ_CAPABILITY_SECRET=ci-job-read-capability-key-for-local-workflow-only
          export ARCANOS_PROCESS_KIND=web
          export RUN_WORKERS=false
          timeout 30s node scripts/start-railway-service-with-integrity.mjs &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          # Kill server
          kill $SERVER_PID || true
          
          echo "✅ Server starts successfully and responds to health checks"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: Verify manual candidate secret-scan guards
        run: node --test scripts/ci-gitleaks-range.test.mjs

      - name: 🔍 Run gitleaks secret scan
        if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verified manual candidate secret scanner
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          scanner_archive="${RUNNER_TEMP}/ci-gitleaks.tar.gz"
          scanner_bin="${RUNNER_TEMP}/ci-gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${scanner_archive}"
          printf '%s  %s\n' "${GITLEAKS_ARCHIVE_SHA256}" "${scanner_archive}" | sha256sum --check --strict
          mkdir -m 700 "${scanner_bin}"
          tar -xzf "${scanner_archive}" -C "${scanner_bin}" gitleaks
          test "$("${scanner_bin}/gitleaks" version)" = "${GITLEAKS_VERSION}"

      - name: Scan complete exact manual candidate commit range
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITLEAKS_BIN: ${{ runner.temp }}/ci-gitleaks/gitleaks
        run: node scripts/ci-gitleaks-range.mjs

      # The action's PR API request reads only its first 30 commits. Its installed
      # scanner also checks the complete immutable event range, with the same defaults.
      - name: Scan complete exact PR commit range
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${PR_BASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GITLEAKS_PR_RANGE_INVALID' >&2
            exit 1
          fi
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          gitleaks git . --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" --redact --no-banner

      - name: 🔒 Run npm security audit
        shell: bash
        run: |
          set -euo pipefail
          audit_exit=0
          npm audit --omit=dev --json > npm-audit.json || audit_exit=$?
          node scripts/check-npm-audit.js npm-audit.json
          echo "Production npm audit policy passed (raw npm exit=$audit_exit)"

      - name: 📜 License compliance check
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0"

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔒 Run Python dependency audit
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          python -m pip_audit --requirement daemon-python/requirements.txt

  sdk-compliance-audit:
    name: Convergence Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: ♻️ Run convergence gate
        run: npm run converge:ci

      - name: 📊 Upload convergence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converge-artifacts
          path: converge-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  python-cli-windows:
    name: Python CLI (Windows)
    runs-on: windows-latest
    needs: [lint-and-typecheck]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai requests python-dotenv tenacity sentry-sdk pytest pytest-mock rich "jsonschema>=4.23.0,<5" "referencing>=0.35.1,<1"

      - name: 🧪 Validate CLI offline contract
        run: python daemon-python/validate_backend_cli_offline.py

      - name: 🧪 Run Python unit tests with coverage
        run: |
          pip install pytest-cov
          pytest daemon-python/tests/ -q --cov=daemon-python/arcanos --cov-report=xml:coverage-python.xml

      - name: 📊 Skip Python Codecov upload
        run: echo "Python coverage is outside the current reported Codecov project scope."

      - name: Set up pinned Node.js for Windows fixture contracts
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: Install and build fixture dependencies
        run: npm ci && npm run build:packages

      - name: Verify Windows receipt and publishing isolation contracts
        run: |
          node scripts/run-jest.mjs --runTestsByPath tests/railway-production-readonly-inspection.test.js --coverage=false --runInBand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/stacked-draft-preview-workflow.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  local-agent-sandbox-linux:
    name: Local Agent Sandbox (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install focused Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "jsonschema>=4.23.0,<5" "referencing>=0.35.1,<1"

      - name: 🐳 Build immutable local sandbox image
        shell: bash
        run: |
          image_id="$(
            docker build \
              --quiet \
              --file daemon-python/Dockerfile.local-agent-tests \
              .
          )"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Sandbox build did not return an immutable local image ID." >&2
            exit 1
          fi
          inspected_id="$(docker image inspect --format '{{.Id}}' "$image_id")"
          if [[ "$inspected_id" != "$image_id" ]]; then
            echo "Sandbox image identity changed after build." >&2
            exit 1
          fi
          echo "ARCANOS_LOCAL_AGENT_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"

      - name: 🛡️ Run effective sandbox and Linux link-race checks
        env:
          PYTHONPATH: daemon-python
          ARCANOS_LOCAL_AGENT_TEST_EXECUTION_MODE: sandboxed
          ARCANOS_LOCAL_AGENT_SANDBOX_RUNTIME: docker
          ARCANOS_LOCAL_AGENT_SANDBOX_E2E: '1'
          ARCANOS_CI_SANDBOX_SENTINEL: must-not-enter-the-container
        run: |
           python -m pytest -q \
             daemon-python/tests/test_local_agent_sandbox_security.py \
             daemon-python/tests/test_local_agent_sandbox_container_e2e.py

  local-agent-postgres-concurrency:
    name: PostgreSQL Fencing & Local Agent Concurrency
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: arcanos_ci
          POSTGRES_PASSWORD: local-agent-ci-only
          POSTGRES_DB: arcanos_audit_pg18_20260727
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcanos_ci -d arcanos_audit_pg18_20260727"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCANOS_POSTGRES_TESTS_REQUIRE_DATABASE: '1'
      LOCAL_AGENT_HARDENING_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      JOB_CLAIM_FENCING_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      DAG_SNAPSHOT_GENERATION_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      JOB_WORKER_BUDGET_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      JOB_STALE_RECOVERY_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      BACKSTAGE_ROSTER_ATOMICITY_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      BACKSTAGE_STORYLINE_ATOMICITY_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      BACKSTAGE_CANON_STORYLINE_PG18_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      BACKSTAGE_NOTION_PARTITION_PG18_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      NON_GPT_TERMINAL_RETENTION_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      GPT_ACCESS_DEVICE_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      SELF_HEAL_PREVIEW_OWNERSHIP_TEST_DATABASE_URL: >-
        postgresql://arcanos_ci:local-agent-ci-only@127.0.0.1:5432/arcanos_audit_pg18_20260727
      SELF_HEAL_PREVIEW_OWNERSHIP_CONFIRM_DISPOSABLE: disposable-loopback-only

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: Build shared packages for PostgreSQL HTTP consumers
        run: npm run build:packages

      - name: 🗄️ Verify database-enforced local-agent semantics
        run: npm run test:local-agent-postgres

      - name: 🧱 Verify PostgreSQL fencing, Backstage atomicity, partition storage, and retention
        run: npm run test:postgres-fencing

      - name: Verify self-heal preview ownership, real role locks, and restart admission
        timeout-minutes: 5
        run: node scripts/run-jest.mjs --runTestsByPath tests/integration/self-heal-preview-ownership.pg18.integration.test.ts --coverage=false --runInBand

      - name: Verify Swift device clients through HTTP and disposable PostgreSQL
        timeout-minutes: 10
        env:
          IOS_DEVICE_E2E_DATABASE_URL: ${{ env.GPT_ACCESS_DEVICE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          swift --version
          swift build --package-path clients/ios/ArcanosKit --product ArcanosDeviceE2E
          ios_device_e2e_bin_dir=$(swift build --package-path clients/ios/ArcanosKit --show-bin-path)
          mkdir -p local_artifacts
          IOS_DEVICE_E2E_SWIFT_BINARY="$ios_device_e2e_bin_dir/ArcanosDeviceE2E" \
            node scripts/validate-ios-device-gateway-e2e.mjs | tee local_artifacts/ios-device-e2e-proof.json

      - name: Retain sanitized Swift device E2E proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-e2e-proof-${{ github.sha }}
          path: local_artifacts/ios-device-e2e-proof.json
          if-no-files-found: error
          retention-days: 7

  runtime-redis-admission:
    name: Standalone Runtime Redis Admission
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_RUNTIME_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AI_RUNTIME_TEST_REDIS_CONFIRM_DISPOSABLE: disposable-loopback-only
      PUBLIC_PROVIDER_TEST_REDIS_URL: redis://127.0.0.1:6379/14
      PUBLIC_PROVIDER_TEST_REDIS_CONFIRM_DISPOSABLE: disposable-loopback-only

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Verify standalone runtime regressions
        run: npm run test:runtime-integration

      - name: 🧱 Verify Redis admission and BullMQ execution invariants
        run: npm run test:runtime-redis-integration

      - name: 🌐 Verify public provider Redis admission invariants
        run: npm run test:public-provider-redis-integration

  all-checks-complete:
    name: All Checks Complete
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [lint-and-typecheck, build, test, validate-railway-compatibility, validate-deployment-readiness, security-audit, sdk-compliance-audit, python-cli-windows, local-agent-sandbox-linux, local-agent-postgres-concurrency, runtime-redis-admission]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout aggregate verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧾 Verify every required job result
        id: required-results
        env:
          ARCANOS_REQUIRED_CI_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/verify-required-ci-results.mjs

      - name: Write sanitized per-SHA CI receipts
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          ARCANOS_CI_RECEIPTS_ENABLED: 'true'
          ARCANOS_CI_VERIFIER_STEP_OUTCOME: ${{ steps.required-results.outcome }}
          ARCANOS_REQUIRED_CI_RESULTS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-required-ci-results.mjs --write-receipts

      - name: Retain per-SHA CI verification receipts
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-receipts-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arcanos-ci-verification-receipts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: ✅ All checks passed
        run: |
          echo "✅ Every required CI/CD dependency reported success."
          echo "✅ All nine required PostgreSQL suites ran under the fail-closed database contract."
          echo "ℹ️ Production promotion remains subject to the separate rollout policy and live readiness verification."
